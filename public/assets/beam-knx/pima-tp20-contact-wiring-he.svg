<text x="430" y="116" class="h">TX / TP-20</text><text x="430" y="147" direction="rtl" unicode-bidi="plaintext" text-anchor="end">זוג POWER / בתכנון זה 12V</text><text x="555" y="182" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">מסוף POWER</text><text x="555" y="210" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">מסוף POWER</text>
<circle cx="435" cy="178" r="5" class="dot"/><circle cx="435" cy="205" r="5" class="dot"/>
<rect x="840" y="82" width="325" height="480" rx="12" class="box"/>
<text x="862" y="116" class="h">RX / TP-20</text><text x="862" y="147" direction="rtl" unicode-bidi="plaintext" text-anchor="end">זוג POWER / בתכנון זה 12V</text>
<text x="930" y="182" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">מסוף POWER</text><text x="930" y="210" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">מסוף POWER</text>
<circle cx="860" cy="178" r="5" class="dot"/><circle cx="860" cy="205" r="5" class="dot"/>
<path d="M295 178 H430 M350 178 V255 H805 V178 H855" class="p"/>
<path d="M295 205 H430 M380 205 V280 H825 V205 H855" class="z"/>
<circle cx="350" cy="178" r="5" fill="#a84b0b"/><circle cx="380" cy="205" r="5" fill="#545f68"/>
<text x="865" y="320" direction="rtl" unicode-bidi="plaintext" text-anchor="end">ALARM NC / מגע יבש</text><text x="865" y="346" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">סגור במנוחה · נפתח בזיהוי</text>
<circle cx="860" cy="370" r="5" class="dot"/><circle cx="860" cy="405" r="5" class="dot"/>
<path d="M865 370 H1115 V405 H865" fill="none" stroke="#102d41" stroke-width="2"/>
<text x="865" y="455" direction="rtl" unicode-bidi="plaintext" text-anchor="end">TAMPER / לפי בחירה</text>
<circle cx="860" cy="485" r="5" class="dot"/><circle cx="860" cy="520" r="5" class="dot"/>
<path d="M865 485 H1115 V520 H865" fill="none" stroke="#102d41" stroke-width="2"/>
<rect x="35" y="330" width="350" height="330" rx="12" class="box"/>
<text x="55" y="365" class="h">Siemens UP 220/21</text><text x="55" y="395" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">רתמת כניסות / כינויי ערוצים</text>
<text x="55" y="436">A1</text><circle cx="365" cy="430" r="5" class="dot"/>
<text x="55" y="471">A2</text><circle cx="365" cy="465" r="5" class="dot"/>
<text x="55" y="526" direction="rtl" unicode-bidi="plaintext" text-anchor="end">B1 (לפי בחירה)</text><circle cx="365" cy="520" r="5" class="dot"/>
<text x="55" y="561" direction="rtl" unicode-bidi="plaintext" text-anchor="end">B2 (לפי בחירה)</text><circle cx="365" cy="555" r="5" class="dot"/>
<text x="55" y="620">KNX +</text><circle cx="200" cy="614" r="5" class="dot"/>
<text x="235" y="620">KNX −</text><circle cx="350" cy="614" r="5" class="dot"/>
<path d="M370 430 H620 V370 H855 M370 465 H665 V405 H855" class="a"/>
<text x="440" y="355" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">ערוץ A: מגע אזעקה NC בלבד</text>
<path d="M370 520 H720 V485 H855 M370 555 H765 V520 H855" class="b"/>
<text x="425" y="600" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">ערוץ B: לאמת מגע יבש של פתיחת מכסה לפני חיבור</text>
<path d="M200 619 V705 M350 619 V705" class="bus"/>
<text x="45" y="738" direction="rtl" unicode-bidi="plaintext" text-anchor="end">אל KNX + / −: יציאת BUS עם משנק, N 305 והאקטואטור מחוברים במקביל</text>
<rect x="35" y="767" width="1130" height="136" rx="12" fill="#fff7e8" stroke="#d6ae6c"/>
<text x="55" y="797" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">• סימוני A1/A2/B1/B2 הם כינויים בשרטוט ולא מספרי פינים. יש לבדוק את הרתמה בפועל.</text>
<text x="55" y="825" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">• לפי PIMA כניסת POWER אינה תלוית קוטביות. סימוני + / 0V מוצגים להבהרת חלוקת ההזנה.</text>
<text x="55" y="853" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">• אין חיבור בין מתח הגלאי לכניסות PBI או לקו KNX. אורך כבל מגע מרבי: 10 מטר לערוץ.</text>
<text x="55" y="881" class="s" direction="rtl" unicode-bidi="plaintext" text-anchor="end">• צבעי הקווים אינם הוראות צבע לחוטים. המגעים מוצגים במנוחה; השרטוט אינו סידור המסופים הפיזי.</text>
</svg>
