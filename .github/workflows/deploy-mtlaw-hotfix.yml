name: Deploy MT-Law portal hotfix

on:
  push:
    branches:
      - main
    paths:
      - 'public/mt-law/**'
      - 'tests/mt-law/**'
      - '.github/workflows/deploy-mtlaw-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mtlaw-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate MT-Law hotfix
    runs-on: ubuntu-latest

    steps:
      - name: Mark MT-Law deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ifeel/mtlaw-production',
              description: 'Validating MT-Law before the focused production deployment',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup production-compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Patch and validate MT-Law portal
        run: |
          node scripts/deploy/patch-mtlaw-php74.mjs public/mt-law/_bootstrap.php
          find public/mt-law -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/mt-law/gate-unit.php
          php tests/mt-law/auth-unit.php

      - name: Prepare focused deployment artifact
        run: |
          rm -rf mtlaw-hotfix
          mkdir -p mtlaw-hotfix/mt-law
          cp -a public/mt-law/. mtlaw-hotfix/mt-law/
          test -f mtlaw-hotfix/mt-law/.htaccess
          test -f mtlaw-hotfix/mt-law/gate.php
          test -f mtlaw-hotfix/mt-law/_bootstrap.php
          test -f mtlaw-hotfix/mt-law/_gate_view.php
          grep -Fq 'action="/mt-law/gate.php"' mtlaw-hotfix/mt-law/_gate_view.php
          grep -Fq 'name="marketing_opt_in" value="yes" required' mtlaw-hotfix/mt-law/_gate_view.php
          if grep -Eq '\bmixed[[:space:]]+\$' mtlaw-hotfix/mt-law/_bootstrap.php; then
            echo 'PHP 8 mixed parameter type remains in the focused artifact.' >&2
            exit 1
          fi
          echo 'Focused MT-Law artifact is ready.'

      - name: Upload focused artifact including hidden files
        uses: actions/upload-artifact@v4
        with:
          name: mtlaw-hotfix-${{ github.sha }}
          path: mtlaw-hotfix/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy MT-Law hotfix
    needs: validate
    runs-on:
      - self-hosted
      - windows
      - x64
      - ifeel-deploy
    environment:
      name: production
      url: https://i-feel.co.il/mt-law/
    concurrency:
      group: ifeel-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependency
        shell: cmd
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Download focused artifact
        uses: actions/download-artifact@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          name: mtlaw-hotfix-${{ github.sha }}
          path: mtlaw-hotfix

      - name: Confirm secure portal files survived transfer
        shell: cmd
        run: |
          if not exist mtlaw-hotfix\mt-law\.htaccess exit /b 1
          if not exist mtlaw-hotfix\mt-law\gate.php exit /b 1
          if not exist mtlaw-hotfix\mt-law\_bootstrap.php exit /b 1
          if not exist mtlaw-hotfix\mt-law\_gate_view.php exit /b 1
          echo Focused MT-Law files are present.

      - name: Upload MT-Law directory through explicit FTPS
        shell: cmd
        env:
          NODE_OPTIONS: --use-system-ca
          IFEEL_FTP_SERVER: ${{ secrets.IFEEL_FTP_SERVER || secrets.FTP_SERVER }}
          IFEEL_FTP_USERNAME: ${{ secrets.IFEEL_FTP_USERNAME || secrets.FTP_USERNAME }}
          IFEEL_FTP_PASSWORD: ${{ secrets.IFEEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          IFEEL_FTP_SERVER_DIR: ${{ secrets.IFEEL_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
        run: node scripts\deploy\ftps-upload.mjs mtlaw-hotfix

  verify:
    name: Verify live MT-Law entry and POST
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check live entry, direct gate and consent enforcement
        shell: bash
        run: |
          set -euo pipefail
          base='https://i-feel.co.il'
          cache="$(date +%s)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cookie="$work/cookies.txt"

          fail_response() {
            local label="$1"
            local code="$2"
            local file="$3"
            echo "FAIL label=${label} http=${code}"
            echo "BODY-BEGIN ${label}"
            head -c 3000 "$file" || true
            echo
            echo "BODY-END ${label}"
            exit 1
          }

          get_page() {
            local label="$1"
            local url="$2"
            local file="$3"
            local code
            code="$(curl --silent --show-error --location --compressed \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --user-agent "I-Feel-MT-Law-Hosted-Verify/${cache}" \
              --cookie "$cookie" --cookie-jar "$cookie" \
              --output "$file" --write-out '%{http_code}' --max-time 45 \
              "${url}?_ifeel_mtlaw_verify=${cache}")"
            echo "GET label=${label} http=${code} url=${url}"
            [[ "$code" == '200' ]] || fail_response "$label" "$code" "$file"
          }

          post_page() {
            local label="$1"
            local file="$2"
            shift 2
            local code
            local args=(
              --silent --show-error --compressed
              --header 'Cache-Control: no-cache'
              --header 'Pragma: no-cache'
              --user-agent "I-Feel-MT-Law-Hosted-Verify/${cache}"
              --cookie "$cookie" --cookie-jar "$cookie"
              --output "$file" --write-out '%{http_code}' --max-time 45
              --request POST
            )
            for value in "$@"; do
              args+=(--data-urlencode "$value")
            done
            args+=("${base}/mt-law/gate.php?_ifeel_mtlaw_verify=${cache}")
            code="$(curl "${args[@]}")"
            echo "POST label=${label} http=${code} url=${base}/mt-law/gate.php"
            [[ "$code" == '200' ]] || fail_response "$label" "$code" "$file"
          }

          get_page 'entry' "${base}/mt-law/" "$work/entry.html"
          for marker in \
            'id="gate-title"' \
            'action="/mt-law/gate.php"' \
            'name="marketing_opt_in" value="yes" required' \
            'ניתן לבטל את ההרשמה בכל עת' \
            '/mt-law/mt-law-logo.svg'; do
            grep -Fq "$marker" "$work/entry.html" || fail_response "entry-missing-${marker}" 200 "$work/entry.html"
          done
          if grep -Fq 'action="/mt-law/"' "$work/entry.html"; then
            fail_response 'unsafe-directory-post-target' 200 "$work/entry.html"
          fi
          echo 'OK entry page, direct actions and consent wording'

          get_page 'direct-gate' "${base}/mt-law/gate.php" "$work/gate.html"
          grep -Fq 'id="gate-title"' "$work/gate.html" || fail_response 'direct-gate-marker' 200 "$work/gate.html"

          csrf="$(python3 - "$work/gate.html" <<'PY'
          import html, re, sys
          body = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'name="csrf"\s+value="([^"]+)"', body)
          print(html.unescape(match.group(1)) if match else '')
          PY
          )"
          [[ -n "$csrf" ]] || fail_response 'missing-csrf' 200 "$work/gate.html"

          post_page 'consent-required' "$work/consent.html" \
            "csrf=${csrf}" \
            'action=request_code' \
            'email=routing-check@mt-law.co.il'
          grep -Fq 'כדי לקבל קוד כניסה יש לאשר קבלת עדכונים והטבות' "$work/consent.html" \
            || fail_response 'consent-not-enforced' 200 "$work/consent.html"
          grep -Fq 'ניתן לבטל את ההרשמה בכל עת' "$work/consent.html" \
            || fail_response 'unsubscribe-wording-missing' 200 "$work/consent.html"
          echo 'OK consent is required before OTP sending'

          post_page 'direct-post-route' "$work/post.html" \
            "csrf=${csrf}" \
            'action=request_code' \
            'email=routing-check@example.com' \
            'marketing_opt_in=yes'
          grep -Fq 'id="gate-title"' "$work/post.html" || fail_response 'post-gate-marker' 200 "$work/post.html"
          grep -Fq 'הכניסה פתוחה רק לכתובות דואר' "$work/post.html" \
            || fail_response 'post-routing-response' 200 "$work/post.html"
          echo 'OK direct POST returns the portal without 404 or 500'
          echo 'MT-Law live verification succeeded.'

  report:
    name: Report MT-Law production status
    if: always()
    needs:
      - validate
      - deploy
      - verify
    runs-on: ubuntu-latest
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}

    steps:
      - name: Publish final MT-Law status
        uses: actions/github-script@v7
        with:
          script: |
            const validateResult = process.env.VALIDATE_RESULT;
            const deployResult = process.env.DEPLOY_RESULT;
            const verifyResult = process.env.VERIFY_RESULT;
            const success = validateResult === 'success' && deployResult === 'success' && verifyResult === 'success';
            const description = success
              ? 'MT-Law focused deployment and live verification succeeded'
              : `MT-Law failed: validate=${validateResult}, deploy=${deployResult}, verify=${verifyResult}`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ifeel/mtlaw-production',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
