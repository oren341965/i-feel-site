name: Deploy MT-Law portal hotfix

on:
  push:
    branches:
      - main
    paths:
      - 'public/mt-law/**'
      - 'tests/mt-law/**'
      - 'scripts/deploy/verify-live.ps1'
      - '.github/workflows/deploy-mtlaw-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mtlaw-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate MT-Law hotfix
    runs-on: ubuntu-latest

    steps:
      - name: Mark MT-Law deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ifeel/mtlaw-production',
              description: 'Validating MT-Law before the focused production deployment',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup production-compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Patch and validate MT-Law portal
        run: |
          node scripts/deploy/patch-mtlaw-php74.mjs public/mt-law/_bootstrap.php
          find public/mt-law -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/mt-law/gate-unit.php
          php tests/mt-law/auth-unit.php

      - name: Prepare focused deployment artifact
        run: |
          rm -rf mtlaw-hotfix
          mkdir -p mtlaw-hotfix/mt-law
          cp -a public/mt-law/. mtlaw-hotfix/mt-law/
          test -f mtlaw-hotfix/mt-law/.htaccess
          test -f mtlaw-hotfix/mt-law/gate.php
          test -f mtlaw-hotfix/mt-law/_bootstrap.php
          test -f mtlaw-hotfix/mt-law/_gate_view.php
          grep -Fq 'action="/mt-law/gate.php"' mtlaw-hotfix/mt-law/_gate_view.php
          grep -Fq 'name="marketing_opt_in" value="yes" required' mtlaw-hotfix/mt-law/_gate_view.php
          if grep -Eq '\bmixed[[:space:]]+\$' mtlaw-hotfix/mt-law/_bootstrap.php; then
            echo 'PHP 8 mixed parameter type remains in the focused artifact.' >&2
            exit 1
          fi
          echo 'Focused MT-Law artifact is ready.'

      - name: Upload focused artifact including hidden files
        uses: actions/upload-artifact@v4
        with:
          name: mtlaw-hotfix-${{ github.sha }}
          path: mtlaw-hotfix/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy MT-Law hotfix
    needs: validate
    runs-on:
      - self-hosted
      - windows
      - x64
      - ifeel-deploy
    outputs:
      verify_message: ${{ steps.verify.outputs.message }}
    environment:
      name: production
      url: https://i-feel.co.il/mt-law/
    concurrency:
      group: ifeel-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependency
        shell: cmd
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Download focused artifact
        uses: actions/download-artifact@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          name: mtlaw-hotfix-${{ github.sha }}
          path: mtlaw-hotfix

      - name: Confirm secure portal files survived transfer
        shell: cmd
        run: |
          if not exist mtlaw-hotfix\mt-law\.htaccess exit /b 1
          if not exist mtlaw-hotfix\mt-law\gate.php exit /b 1
          if not exist mtlaw-hotfix\mt-law\_bootstrap.php exit /b 1
          if not exist mtlaw-hotfix\mt-law\_gate_view.php exit /b 1
          echo Focused MT-Law files are present.

      - name: Upload MT-Law directory through explicit FTPS
        shell: cmd
        env:
          NODE_OPTIONS: --use-system-ca
          IFEEL_FTP_SERVER: ${{ secrets.IFEEL_FTP_SERVER || secrets.FTP_SERVER }}
          IFEEL_FTP_USERNAME: ${{ secrets.IFEEL_FTP_USERNAME || secrets.FTP_USERNAME }}
          IFEEL_FTP_PASSWORD: ${{ secrets.IFEEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          IFEEL_FTP_SERVER_DIR: ${{ secrets.IFEEL_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
        run: node scripts\deploy\ftps-upload.mjs mtlaw-hotfix

      - name: Verify live MT-Law access and consent
        id: verify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy\verify-live.ps1 -BaseUrl https://i-feel.co.il/
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'message=MT-Law live verification succeeded' -Encoding UTF8
          }
          catch {
            $message = [string]$_.Exception.Message
            $message = ($message -replace '[\r\n]+', ' ' -replace '%', 'percent').Trim()
            if ($message.Length -gt 120) {
              $message = $message.Substring(0, 120)
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("message=" + $message) -Encoding UTF8
            Write-Error $message
            exit 1
          }

  report:
    name: Report MT-Law production status
    if: always()
    needs:
      - validate
      - deploy
    runs-on: ubuntu-latest
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      VERIFY_MESSAGE: ${{ needs.deploy.outputs.verify_message }}

    steps:
      - name: Publish final MT-Law status
        uses: actions/github-script@v7
        with:
          script: |
            const validateResult = process.env.VALIDATE_RESULT;
            const deployResult = process.env.DEPLOY_RESULT;
            const verifyMessage = (process.env.VERIFY_MESSAGE || '').trim();
            const success = validateResult === 'success' && deployResult === 'success';
            const description = success
              ? 'MT-Law focused deployment and live verification succeeded'
              : (verifyMessage || `MT-Law failed: validate=${validateResult}, deploy=${deployResult}`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ifeel/mtlaw-production',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
