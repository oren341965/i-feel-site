name: Validate and deploy site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint secure staff portal PHP
        run: find public/staff-expenses -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build and validate Astro site
        run: npm run build

      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on:
      - self-hosted
      - windows
      - x64
      - ifeel-deploy
    environment:
      name: production
      url: https://i-feel.co.il/
    concurrency:
      group: ifeel-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependencies
        shell: cmd
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Download validated site artifact
        uses: actions/download-artifact@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          name: site-dist-${{ github.sha }}
          path: dist

      - name: Upload dist through persistent explicit FTPS
        shell: cmd
        env:
          NODE_OPTIONS: --use-system-ca
          IFEEL_FTP_SERVER: ${{ secrets.IFEEL_FTP_SERVER || secrets.FTP_SERVER }}
          IFEEL_FTP_USERNAME: ${{ secrets.IFEEL_FTP_USERNAME || secrets.FTP_USERNAME }}
          IFEEL_FTP_PASSWORD: ${{ secrets.IFEEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          IFEEL_FTP_SERVER_DIR: ${{ secrets.IFEEL_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
        run: node scripts\deploy\ftps-upload.mjs dist

      - name: Verify live site
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: .\scripts\deploy\verify-live.ps1 -BaseUrl https://i-feel.co.il/
