
name: Validate and deploy site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '.claude/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest

    steps:
      - name: Mark production deployment pending
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ifeel/production',
              description: 'Validating the site before production deployment',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup production-compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint secure staff portal
        run: find public/staff-expenses -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test secure staff portal
        run: php -d upload_max_filesize=12M -d post_max_size=64M -d max_file_uploads=20 tests/staff-expenses/portal-unit.php

      - name: Patch MT-Law source for PHP 7.4
        run: node scripts/deploy/patch-mtlaw-php74.mjs public/mt-law/_bootstrap.php

      - name: Confirm MT-Law PHP runtime
        run: php -v

      - name: Lint MT-Law portal
        run: find public/mt-law -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test MT-Law consent and authentication
        run: |
          php tests/mt-law/gate-unit.php
          php tests/mt-law/auth-unit.php

      - name: Build and validate Astro site
        run: npm run build

      - name: Verify patched MT-Law file is in dist
        run: |
          test -f dist/mt-law/_bootstrap.php
          if grep -Eq '\bmixed[[:space:]]+\$' dist/mt-law/_bootstrap.php; then
            echo 'PHP 8 mixed parameter type remains in dist/mt-law/_bootstrap.php.' >&2
            exit 1
          fi
          echo 'MT-Law bootstrap in dist is PHP 7.4 compatible.'

      - name: Verify protected deployment files exist
        run: |
          test -f dist/.htaccess
          test -f dist/mt-law/.htaccess
          test -f dist/customer-benefits/.htaccess
          test -f dist/staff-expenses/.htaccess
          echo 'Protected .htaccess files exist in dist.'

      - name: Upload validated site artifact including hidden files
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on:
      - self-hosted
      - windows
      - x64
      - ifeel-deploy
    outputs:
      verify_message: ${{ steps.verify.outputs.message }}
    environment:
      name: production
      url: https://i-feel.co.il/
    concurrency:
      group: ifeel-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependencies
        shell: cmd
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Download validated site artifact
        uses: actions/download-artifact@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          name: site-dist-${{ github.sha }}
          path: dist

      - name: Restore and confirm protected deployment files
        shell: cmd
        run: |
          if not exist dist mkdir dist
          if not exist dist\mt-law mkdir dist\mt-law
          if not exist dist\customer-benefits mkdir dist\customer-benefits
          if not exist dist\staff-expenses mkdir dist\staff-expenses
          copy /Y public\.htaccess dist\.htaccess
          copy /Y public\mt-law\.htaccess dist\mt-law\.htaccess
          copy /Y public\customer-benefits\.htaccess dist\customer-benefits\.htaccess
          copy /Y public\staff-expenses\.htaccess dist\staff-expenses\.htaccess
          if not exist dist\.htaccess exit /b 1
          if not exist dist\mt-law\.htaccess exit /b 1
          if not exist dist\customer-benefits\.htaccess exit /b 1
          if not exist dist\staff-expenses\.htaccess exit /b 1
          echo Protected deployment files restored successfully.

      - name: Upload dist through persistent explicit FTPS
        shell: cmd
        env:
          NODE_OPTIONS: --use-system-ca
          IFEEL_FTP_SERVER: ${{ secrets.IFEEL_FTP_SERVER || secrets.FTP_SERVER }}
          IFEEL_FTP_USERNAME: ${{ secrets.IFEEL_FTP_USERNAME || secrets.FTP_USERNAME }}
          IFEEL_FTP_PASSWORD: ${{ secrets.IFEEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          IFEEL_FTP_SERVER_DIR: ${{ secrets.IFEEL_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
        run: node scripts\deploy\ftps-upload.mjs dist

      - name: Verify live site
        id: verify
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            .\scripts\deploy\verify-live.ps1 -BaseUrl https://i-feel.co.il/
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'message=live verification succeeded' -Encoding UTF8
          }
          catch {
            $message = [string]$_.Exception.Message
            $message = ($message -replace '[\r\n]+', ' ' -replace '%', 'percent').Trim()
            if ($message.Length -gt 120) {
              $message = $message.Substring(0, 120)
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("message=" + $message) -Encoding UTF8
            Write-Error $message
            exit 1
          }

  report:
    name: Report production deployment status
    if: always() && github.event_name != 'pull_request'
    needs:
      - validate
      - deploy
    runs-on: ubuntu-latest
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      VERIFY_MESSAGE: ${{ needs.deploy.outputs.verify_message }}

    steps:
      - name: Publish final production status
        uses: actions/github-script@v7
        with:
          script: |
            const validateResult = process.env.VALIDATE_RESULT;
            const deployResult = process.env.DEPLOY_RESULT;
            const verifyMessage = (process.env.VERIFY_MESSAGE || '').trim();
            const success = validateResult === 'success' && deployResult === 'success';
            const description = success
              ? 'Production deployment and live verification succeeded'
              : (verifyMessage || `Production failed: validate=${validateResult}, deploy=${deployResult}`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ifeel/production',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

