name: Build and deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Astro site
        run: npm run build

      - name: Deploy dist to cPanel by SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH || secrets.FTP_SERVER_DIR }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=20'
