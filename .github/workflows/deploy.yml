name: Validate and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest

    steps:
      - name: Mark production deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ifeel/production',
              description: 'Validating the site before production deployment',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint secure PHP portals
        run: find public/staff-expenses public/mt-law -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test secure staff portal
        run: php -d upload_max_filesize=12M -d post_max_size=64M -d max_file_uploads=20 tests/staff-expenses/portal-unit.php

      - name: Test MT-Law consent registry
        run: php tests/mt-law/gate-unit.php

      - name: Build and validate Astro site
        run: npm run build

      - name: Upload validated site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  diagnose:
    name: Diagnose current live MT-Law gate
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Inspect live gate, assets and required content
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="$(date +%s)"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          check_url() {
            local label="$1"
            local url="$2"
            local output="$3"
            local separator='?'
            if [[ "$url" == *\?* ]]; then separator='&'; fi
            local request_url="${url}${separator}_ifeel_diagnose=${cache_bust}"
            local code
            code="$(curl --silent --show-error --location --compressed \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --user-agent "I-Feel-Live-Diagnostic/${cache_bust}" \
              --output "$output" --write-out '%{http_code}' --max-time 45 "$request_url")"
            echo "DIAG label=${label} http=${code} url=${url}"
            if (( code < 200 || code >= 400 )); then
              echo "BODY-BEGIN ${label}"
              head -c 3000 "$output" || true
              echo
              echo "BODY-END ${label}"
              exit 1
            fi
          }

          check_url customer-benefits 'https://i-feel.co.il/customer-benefits/' "$workdir/customer-benefits.html"
          check_url mt-law-gate 'https://i-feel.co.il/mt-law/' "$workdir/mt-law.html"
          check_url gate-css 'https://i-feel.co.il/mt-law/gate.css' "$workdir/gate.css"
          check_url mt-law-logo 'https://i-feel.co.il/mt-law/mt-law-logo.svg' "$workdir/mt-law-logo.svg"

          for marker in 'id="gate-title"' '/mt-law/mt-law-logo.svg' 'name="marketing_opt_in"' 'name="email"'; do
            if ! grep -Fq "$marker" "$workdir/mt-law.html"; then
              echo "MISSING-MARKER marker=${marker}"
              echo 'BODY-BEGIN mt-law-gate'
              head -c 5000 "$workdir/mt-law.html" || true
              echo
              echo 'BODY-END mt-law-gate'
              exit 1
            fi
          done

          echo 'DIAG current live MT-Law gate is complete'

  deploy:
    name: Deploy production
    needs:
      - validate
      - diagnose
    runs-on:
      - self-hosted
      - windows
      - x64
      - ifeel-deploy
    outputs:
      verify_message: ${{ steps.verify.outputs.message }}
    environment:
      name: production
      url: https://i-feel.co.il/
    concurrency:
      group: ifeel-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          node-version: 24
          cache: npm

      - name: Install deployment dependencies
        shell: cmd
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Download validated site artifact
        uses: actions/download-artifact@v4
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          name: site-dist-${{ github.sha }}
          path: dist

      - name: Upload dist through persistent explicit FTPS
        shell: cmd
        env:
          NODE_OPTIONS: --use-system-ca
          IFEEL_FTP_SERVER: ${{ secrets.IFEEL_FTP_SERVER || secrets.FTP_SERVER }}
          IFEEL_FTP_USERNAME: ${{ secrets.IFEEL_FTP_USERNAME || secrets.FTP_USERNAME }}
          IFEEL_FTP_PASSWORD: ${{ secrets.IFEEL_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          IFEEL_FTP_SERVER_DIR: ${{ secrets.IFEEL_FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
        run: node scripts\deploy\ftps-upload.mjs dist

      - name: Verify live site
        id: verify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            .\scripts\deploy\verify-live.ps1 -BaseUrl https://i-feel.co.il/
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'message=live verification succeeded' -Encoding UTF8
          }
          catch {
            $message = [string]$_.Exception.Message
            $message = ($message -replace '[\r\n]+', ' ' -replace '%', 'percent').Trim()
            if ($message.Length -gt 120) {
              $message = $message.Substring(0, 120)
            }
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ("message=" + $message) -Encoding UTF8
            Write-Error $message
            exit 1
          }

  report:
    name: Report production deployment status
    if: always()
    needs:
      - validate
      - diagnose
      - deploy
    runs-on: ubuntu-latest
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      DIAGNOSE_RESULT: ${{ needs.diagnose.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      VERIFY_MESSAGE: ${{ needs.deploy.outputs.verify_message }}

    steps:
      - name: Publish final production status
        uses: actions/github-script@v7
        with:
          script: |
            const validateResult = process.env.VALIDATE_RESULT;
            const diagnoseResult = process.env.DIAGNOSE_RESULT;
            const deployResult = process.env.DEPLOY_RESULT;
            const verifyMessage = (process.env.VERIFY_MESSAGE || '').trim();
            const success = validateResult === 'success' && diagnoseResult === 'success' && deployResult === 'success';
            const description = success
              ? 'Production deployment and live verification succeeded'
              : (verifyMessage || `Production failed: validate=${validateResult}, diagnose=${diagnoseResult}, deploy=${deployResult}`);

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'ifeel/production',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
