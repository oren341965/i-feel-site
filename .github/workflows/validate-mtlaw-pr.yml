name: Validate MT-Law pull request

on:
  pull_request:
    paths:
      - 'public/mt-law/**'
      - 'tests/mt-law/**'
      - 'scripts/deploy/patch-mtlaw-php74.mjs'
      - '.github/workflows/validate-mtlaw-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate MT-Law on PHP 7.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup production-compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Lint and test MT-Law
        run: |
          node scripts/deploy/patch-mtlaw-php74.mjs public/mt-law/_bootstrap.php
          find public/mt-law -maxdepth 1 -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/mt-law/gate-unit.php
          php tests/mt-law/auth-unit.php

