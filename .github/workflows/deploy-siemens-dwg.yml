name: Verify Siemens KNX DWG files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dwg:
    name: Verify Siemens DWG downloads
    runs-on: ubuntu-latest
    steps:
      - name: Verify published DWG files
        shell: bash
        run: |
          set -euo pipefail
          base='https://i-feel.co.il/assets/siemens-knx/dwg'
          files=(
            '5WG1125-1AB22.dwg'
            '5WG1567-1AB22.dwg'
            '5WG1532-1DB51.dwg'
            '5WG1532-1DB31.dwg'
            '5WG1262-1DB51.dwg'
            '5WG1543-1DB51.dwg'
            '5WG1543-1DB31.dwg'
            '5WG1554-1DB31.dwg'
            '5WG1141-1AB03.dwg'
          )
          for file in "${files[@]}"; do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 45 "$base/$file")
            test "$code" -ge 200 -a "$code" -lt 400
            echo "OK $code $base/$file"
          done
          echo 'All 9 Siemens KNX DWG files are live.'
