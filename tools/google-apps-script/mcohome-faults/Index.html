<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>דיווח תקלה MCOHome</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#10233f;font-family:Arial,"Heebo",sans-serif;padding:18px}.card{max-width:680px;margin:auto;background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:22px;box-shadow:0 12px 35px rgba(16,35,63,.08)}h1{margin:0 0 8px;font-size:26px}p{color:#62748b;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:14px}select,input,textarea{width:100%;margin-top:6px;border:1px solid #c8d4e2;border-radius:10px;padding:12px;background:#fff;font:inherit}textarea{min-height:88px;resize:vertical}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{font-weight:600}.checks input{width:auto;margin-left:6px}.button{width:100%;border:0;border-radius:11px;background:#1769aa;color:#fff;padding:14px;font-size:17px;font-weight:700;cursor:pointer}.button[disabled]{opacity:.55}.notice{margin-top:14px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#eaf8ef;color:#176635}.bad{display:block;background:#fff0f0;color:#9c2525}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="card">
    <h1>דיווח יחידת MCOHome תקולה</h1>
    <p>מסמנים את סוג היחידה והתקלה. כל דיווח נרשם ישירות בטבלת המעקב.</p>
    <form id="faultForm">
      <div class="grid">
        <label>תאריך גילוי<input type="date" name="discoveryDate"></label>
        <label>טכנאי<input type="text" name="technician" placeholder="שם הטכנאי"></label>
        <label>לקוח / פרויקט<input type="text" name="project" placeholder="שם לקוח או פרויקט"></label>
        <label>מספר סידורי<input type="text" name="serialNumber" placeholder="S/N"></label>
        <label>דגם / מק״ט<input type="text" name="model" placeholder="אם ידוע"></label>
        <label>סוג מפסק<select name="deviceType" id="deviceType" required><option value="">בחר</option></select></label>
        <label id="nineWrap" hidden>תצורת מפסק 9<select name="nineConfig" id="nineConfig"><option value="">בחר</option></select></label>
        <label>ערוץ / יציאה<input type="text" name="channel" placeholder="למשל CH2 / תריס 1"></label>
        <label class="full">סוג התקלה<select name="faultType" id="faultType" required><option value="">בחר</option></select></label>
        <label class="full">נסיבות / עומס מחובר<input type="text" name="loadContext" placeholder="למשל ספק LED 300W, מנוע תריס"></label>
        <div class="full checks">
          <label><input type="checkbox" name="inrushSuspected"> חשד ל-Inrush Current</label>
          <label><input type="checkbox" name="replaced"> הוחלפה יחידה</label>
          <label><input type="checkbox" name="sentToMcohome"> נשלחה ל-MCOHome</label>
        </div>
        <label>סטטוס<select name="unitStatus" id="unitStatus"></select></label>
        <label>פעולה שבוצעה<input type="text" name="actionTaken" placeholder="איפוס / החלפה / בדיקה"></label>
        <label class="full">הערות<textarea name="notes" placeholder="רק אם צריך להוסיף משהו"></textarea></label>
      </div>
      <p><button class="button" id="submitButton" type="submit">שמור דיווח</button></p>
      <div id="notice" class="notice"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('faultForm');
    const button = document.getElementById('submitButton');
    const notice = document.getElementById('notice');
    const device = document.getElementById('deviceType');
    const nineWrap = document.getElementById('nineWrap');
    const nine = document.getElementById('nineConfig');

    document.querySelector('[name="discoveryDate"]').value = new Date().toISOString().slice(0,10);

    google.script.run.withSuccessHandler(options => {
      fill(device, options.deviceTypes);
      fill(nine, options.nineConfigs);
      fill(document.getElementById('faultType'), options.faultTypes);
      fill(document.getElementById('unitStatus'), options.statuses, false);
    }).getFormOptions();

    function fill(select, values, keepFirst = true) {
      if (!keepFirst) select.innerHTML = '';
      values.forEach(v => {
        const o = document.createElement('option'); o.value = v; o.textContent = v; select.appendChild(o);
      });
    }

    device.addEventListener('change', () => {
      const isNine = device.value === 'מפסק 9';
      nineWrap.hidden = !isNine;
      nine.required = isNine;
      if (!isNine) nine.value = '';
    });

    document.getElementById('faultType').addEventListener('change', e => {
      if (e.target.value === 'ממסר נדבק') form.inrushSuspected.checked = true;
    });

    form.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = Object.fromEntries(fd.entries());
      payload.inrushSuspected = form.inrushSuspected.checked;
      payload.replaced = form.replaced.checked;
      payload.sentToMcohome = form.sentToMcohome.checked;
      button.disabled = true;
      notice.className = 'notice'; notice.textContent = '';
      google.script.run
        .withSuccessHandler(result => {
          notice.className = 'notice ok';
          notice.textContent = 'נשמר בהצלחה. מספר אירוע: ' + result.eventId;
          form.reset();
          document.querySelector('[name="discoveryDate"]').value = new Date().toISOString().slice(0,10);
          nineWrap.hidden = true;
          button.disabled = false;
        })
        .withFailureHandler(err => {
          notice.className = 'notice bad';
          notice.textContent = 'לא ניתן לשמור: ' + (err && err.message ? err.message : err);
          button.disabled = false;
        })
        .saveFaultFromHtml(payload);
    });
  </script>
</body>
</html>
